<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">LIGHT</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" aria-label="Cambiar entre modo oscuro y claro" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" aria-label="Cambiar skin visual">
            <option value="retro">Retro</option>
            <option value="neon">Neon</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel Art</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">POWER-UP</span>
          <span class="value" id="powerup">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box" id="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="score-entry" class="score-entry hidden">
          <input type="text" id="name-input" maxlength="12" placeholder="Tu nombre" aria-label="Tu nombre" />
          <button id="save-score-btn">Guardar</button>
        </div>
        <div id="overlay-highscores" class="highscores-box"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>

      <div id="pause-menu" class="pause-menu hidden">
        <p class="pause-menu-title">PAUSA</p>

        <div class="pause-menu-actions">
          <button id="resume-btn" class="pause-btn">Reanudar</button>
          <button id="pause-restart-btn" class="pause-btn">Reiniciar</button>
        </div>

        <div class="pause-menu-row">
          <span class="label">NIVEL INICIAL</span>
          <div class="level-picker">
            <button id="level-minus" class="level-step" aria-label="Bajar nivel inicial">−</button>
            <span id="start-level-value" class="value">1</span>
            <button id="level-plus" class="level-step" aria-label="Subir nivel inicial">+</button>
          </div>
        </div>

        <button id="toggle-controls-btn" class="pause-btn pause-btn-secondary" aria-expanded="false">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
        </ul>
      </div>
    </div>

    <div id="start-screen" class="overlay hidden">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div id="start-highscores" class="highscores-box"></div>
        <button id="play-btn">Jugar</button>
        <button id="reset-scores-btn" class="btn-secondary">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
